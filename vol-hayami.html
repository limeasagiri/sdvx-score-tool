<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLFORCE早見表 ver.∇</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 早見表専用のレイアウト調整 */
        .content {
            margin-top: 60px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            box-sizing: border-box;
            gap: 15px; /* 各要素間の余白 */
            overflow: hidden;
        }

        /* 他のツールと統一したカードデザイン */
        .controls-card {
            background: rgba(18, 18, 18, 0.85); /* 半透明の黒 */
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(4px); /* 背景を少しぼかして視認性アップ */
        }

        /* 目標表示エリアを中央に配置し、ツール共通のスタイルに */
        .target-vf-box {
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid var(--theme-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 5px;
        }

        .target-vf-label {
            font-size: 11px;
            color: var(--theme-color);
            letter-spacing: 0.1em;
            margin-bottom: 5px;
        }

        .target-vf-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            line-height: 1;
            font-family: 'JetBrains Mono', monospace;
        }

        .target-vf-value .decimal {
            font-size: 1.5rem;
            opacity: 0.8;
        }

        /* テーブルコンテナの調整 */
        .table-container {
            flex-grow: 1;
            overflow: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(18, 18, 18, 0.9);
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
        }

        th {
            position: sticky;
            top: 0;
            background: #121212;
            z-index: 10;
            padding: 10px 5px;
            color: var(--theme-color);
            border-bottom: 2px solid var(--theme-color);
            font-weight: bold;
        }

        td {
            padding: 10px 5px;
            border-bottom: 1px solid #222;
            text-align: center;
            color: #eee;
        }

        /* Lv.列を左に固定してスクロールしても見やすく */
        .level-col {
            position: sticky;
            left: 0;
            background: #1a1a1a;
            z-index: 5;
            font-weight: bold;
            color: var(--theme-color);
            border-right: 2px solid var(--theme-color) !important;
            width: 60px;
        }

        /* ステータス別の配色（既存のクラスを使用） */
        .status-deep { background: rgba(0, 255, 204, 0.3) !important; color: #fff !important; font-weight: bold; }
        .status-clear { background: rgba(0, 255, 204, 0.15) !important; color: #fff !important; }
        .status-near { background: rgba(255, 255, 255, 0.05) !important; color: #888 !important; }
        .status-none { color: #444; }

        .vf-note, .vf-note-special {
            font-size: 10px;
            color: #777;
            margin-top: 5px;
        }
        .vf-note-special { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

<main class="content">
    <div class="controls-card">
        <div class="mode-selector">
            <label>
                <input type="radio" name="fmt" value="std" checked onchange="changeFormat()">
                <div class="label-box"><span>総合VF</span><span class="unit-desc">(XX.xxx)</span></div>
            </label>
            <label>
                <input type="radio" name="fmt" value="int" onchange="changeFormat()">
                <div class="label-box"><span>公式単曲</span><span class="unit-desc">(XXX)</span></div>
            </label>
            <label>
                <input type="radio" name="fmt" value="p1" onchange="changeFormat()">
                <div class="label-box"><span>Tool</span><span class="unit-desc">(XX.x)</span></div>
            </label>
        </div>

        <div class="dropdown-row">
            <div class="control-group">
                <label class="title">表示スコア範囲</label>
                <select id="rangeSel" onchange="render()">
                    <option value="puc_aaa_plus">PUC ～ AAA+</option>
                    <option value="puc_s">PUC ～ S</option>
                    <option value="puc_995">PUC ～ 995k</option>
                </select>
            </div>
            <div class="control-group">
                <label class="title">クリアメダル</label>
                <select id="medalSel" onchange="render()">
                    <option value="1.1">PUC</option>
                    <option value="1.06" selected>UC</option>
                    <option value="1.04">MAXXIVE</option>
                    <option value="1.02">EXCESSIVE</option>
                    <option value="1">EFFECTIVE</option>
                </select>
            </div>
            <div class="control-group">
                <label class="title">クラス</label>
                <select id="classSel" onchange="updateRankOptions()">
                    <option value="1 Sienna">1 Sienna</option>
                    <option value="2 Cobalt">2 Cobalt</option>
                    <option value="3 Dandelion">3 Dandelion</option>
                    <option value="4 Cyan">4 Cyan</option>
                    <option value="5 Scarlet">5 Scarlet</option>
                    <option value="6 Coral">6 Coral</option>
                    <option value="7 Argento">7 Argento</option>
                    <option value="8 Eldora">8 Eldora</option>
                    <option value="9 Crimson">9 Crimson</option>
                    <option value="10 Imperial" selected>10 Imperial</option>
                </select>
            </div>
            <div class="control-group">
                <label class="title">ランク</label>
                <select id="rankSel" onchange="updateByDropdown()"></select>
            </div>
            <div class="control-group" style="grid-column: span 2;">
                <label class="title">目標VF入力</label>
                <input type="number" id="customVF" value="20.000" step="0.05" min="0" oninput="updateByInput()">
            </div>
        </div>
    </div>

    <div class="target-vf-box">
        <div class="target-vf-label" id="targetLabel">目標 (総合VF)</div>
        <div class="target-vf-value" id="dispVF">0<span class="decimal">.000</span></div>
        <div id="vfNote" class="vf-note">※VFは0.05刻みで算出</div>
        <div id="specialNote" class="vf-note-special" style="display:none;">※特定域到達のため、全上位譜面のプレー推奨</div>
    </div>

    <div class="table-container">
        <table id="resultTable">
            <thead><tr id="tableHeader"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</main>

<script src="common.js"></script>
<script>
    /* ロジック部分は一切変更せず、そのまま使用してください */
    // ... (既存のscript内容) ...
</script>
</body>
</html>
