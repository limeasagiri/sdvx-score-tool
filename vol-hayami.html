<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLFORCE早見表 ver.∇</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 早見表専用のデザイン調整 */
        .content {
            margin-top: 60px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            box-sizing: border-box;
            gap: 15px;
            overflow: hidden;
        }

        /* 目標表示ボックスの強調 */
        .target-vf-box {
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid var(--theme-color);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        .target-vf-label {
            font-size: 11px;
            color: var(--theme-color);
            margin-bottom: 4px;
            letter-spacing: 0.1em;
            font-weight: bold;
        }

        .target-vf-value {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
            line-height: 1.1;
        }

        .target-vf-value .decimal {
            font-size: 1.4rem;
            opacity: 0.7;
        }

        /* テーブルのデザイン統一 */
        .table-container {
            flex-grow: 1;
            overflow: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--panel-bg);
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
            table-layout: fixed;
        }

        th {
            position: sticky;
            top: 0;
            background: #1a1a1a;
            z-index: 10;
            border-bottom: 2px solid var(--theme-color);
            padding: 10px 4px;
            color: var(--theme-color);
            font-weight: bold;
        }

        td {
            padding: 8px 4px;
            border-bottom: 1px solid #222;
            border-right: 1px solid #222;
            color: #ccc;
        }

        /* Lv.列を固定して視認性を確保 */
        .level-col {
            position: sticky;
            left: 0;
            background: #1a1a1a;
            font-weight: bold;
            color: var(--theme-color);
            z-index: 5;
            width: 50px;
            border-right: 2px solid var(--theme-color) !important;
        }

        /* ステータス別の背景色（他のツールと共通の透明度） */
        .status-deep { background: rgba(0, 255, 204, 0.25); color: #fff; font-weight: bold; }
        .status-clear { background: rgba(0, 255, 204, 0.15); color: #fff; }
        .status-near { background: rgba(255, 255, 255, 0.05); color: #888; }
        .status-none { color: #444; }

        .vf-note, .vf-note-special {
            font-size: 10px;
            margin-top: 4px;
            color: #777;
        }
        
        .vf-note-special { color: #ffcc00; font-weight: bold; }

        /* スクロールバーのカスタマイズ（任意） */
        .table-container::-webkit-scrollbar { width: 6px; height: 6px; }
        .table-container::-webkit-scrollbar-thumb { background: var(--theme-color); border-radius: 3px; }
    </style>
</head>
<body>

<main class="content">
    <div class="controls-card">
        <div class="mode-selector">
            <label>
                <input type="radio" name="fmt" value="std" checked onchange="changeFormat()">
                <div class="label-box"><span>総合VF</span><span class="unit-desc">(XX.xxx)</span></div>
            </label>
            <label>
                <input type="radio" name="fmt" value="int" onchange="changeFormat()">
                <div class="label-box"><span>公式単曲</span><span class="unit-desc">(XXX)</span></div>
            </label>
            <label>
                <input type="radio" name="fmt" value="p1" onchange="changeFormat()">
                <div class="label-box"><span>Tool</span><span class="unit-desc">(XX.x)</span></div>
            </label>
        </div>

        <div class="dropdown-row">
            <div class="control-group">
                <label class="title">表示スコア範囲</label>
                <select id="rangeSel" onchange="render()">
                    <option value="puc_aaa_plus">PUC ～ AAA+</option>
                    <option value="puc_s">PUC ～ S</option>
                    <option value="puc_995">PUC ～ 995k</option>
                </select>
            </div>
            <div class="control-group">
                <label class="title">クリアメダル</label>
                <select id="medalSel" onchange="render()">
                    <option value="1.1">PUC</option>
                    <option value="1.06" selected>UC</option>
                    <option value="1.04">MAXXIVE</option>
                    <option value="1.02">EXCESSIVE</option>
                    <option value="1">EFFECTIVE</option>
                </select>
            </div>
            <div class="control-group">
                <label class="title">クラス</label>
                <select id="classSel" onchange="updateRankOptions()">
                    <option value="1 Sienna">1 Sienna</option>
                    <option value="2 Cobalt">2 Cobalt</option>
                    <option value="3 Dandelion">3 Dandelion</option>
                    <option value="4 Cyan">4 Cyan</option>
                    <option value="5 Scarlet">5 Scarlet</option>
                    <option value="6 Coral">6 Coral</option>
                    <option value="7 Argento">7 Argento</option>
                    <option value="8 Eldora">8 Eldora</option>
                    <option value="9 Crimson">9 Crimson</option>
                    <option value="10 Imperial" selected>10 Imperial</option>
                </select>
            </div>
            <div class="control-group">
                <label class="title">ランク</label>
                <select id="rankSel" onchange="updateByDropdown()"></select>
            </div>
            <div class="control-group" style="grid-column: span 2;">
                <label class="title">目標VF入力</label>
                <input type="number" id="customVF" value="20.000" step="0.05" min="0" oninput="updateByInput()">
            </div>
        </div>
    </div>

    <div class="target-vf-box">
        <div class="target-vf-label" id="targetLabel">目標 (総合VF)</div>
        <div class="target-vf-value" id="dispVF">0<span class="decimal">.000</span></div>
        <div class="vf-note" id="vfNote">※VFは0.05刻みで算出</div>
        <div class="vf-note-special" id="specialNote" style="display:none;">※特定域到達のため、全上位譜面のプレー推奨</div>
    </div>

    <div class="table-container">
        <table id="resultTable">
            <thead><tr id="tableHeader"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</main>

</body>
</html>
