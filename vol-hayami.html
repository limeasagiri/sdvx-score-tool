<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="style.css">
<style>
    /* 共通設定以外の、このツール固有のスタイルのみ残します */
    body {
        font-family: sans-serif;
        background: #121212;
        color: #e0e0e0;
        padding: 10px;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }

    /* --- コントロールセクション --- */
    .header-controls {
        flex-shrink: 0;
        padding-top: 45px;
        padding-right: 45px;
    } 
    
    .controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 10px;
        background: #1f1f1f;
        padding: 8px;
        border-radius: 10px;
        border: 1px solid #333;
    }
    
    .mode-selector {
        display: flex;
        gap: 4px;
        background: #121212;
        padding: 4px;
        border-radius: 8px;
        margin-bottom: 4px;
        width: 100%;
        box-sizing: border-box;
    }
    
    .mode-selector label {
        flex: 1;
        text-align: center;
        cursor: pointer;
        padding: 4px 2px;
        border-radius: 5px;
        color: #888;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
    }
    
    .mode-selector input {
        display: none;
    }
    
    .mode-selector span {
        display: block;
        width: 100%;
        border-radius: 4px;
        line-height: 1.3;
        font-size: 10px;
    }
    
    .mode-selector .unit-desc {
        font-size: 8px;
        opacity: 0.7;
        display: block;
    }
    
    .mode-selector input:checked + span {
        background: #333;
        color: #00ffcc;
        font-weight: bold;
    }

    .dropdown-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        width: 100%;
    }
    
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    
    label.title {
        font-size: 9px;
        color: #aaa;
        margin-left: 2px;
    }
    
    select, input {
        padding: 4px 8px;
        border-radius: 5px;
        border: 1px solid #444;
        background: #2a2a2a;
        color: #fff;
        font-size: 13px;
        width: 100%;
        box-sizing: border-box;
        height: 34px;
    }
    
    .target-vf-box {
        background: linear-gradient(135deg, #1f1f1f, #121212);
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 10px;
        border-left: 4px solid #00ffcc;
    }
    
    .target-vf-label {
        font-size: 10px;
        color: #00ffcc;
        margin-bottom: 2px;
    }
    
    .target-vf-value {
        font-size: 24px;
        font-weight: bold;
        letter-spacing: -0.5px;
    }
    
    .decimal {
        font-size: 16px;
        color: #fff;
        opacity: 0.85;
        margin-left: 1px;
    }
    
    .vf-note {
        font-size: 8px;
        color: #888;
        margin-top: 2px;
        display: none;
        line-height: 1.2;
    }
    
    .vf-note-special {
        font-size: 8px;
        color: #ffaa00;
        margin-top: 2px;
        display: none;
        font-weight: bold;
        line-height: 1.2;
    }

    /* --- テーブルセクション --- */
    .table-container {
        flex-grow: 1;
        overflow: auto;
        border-radius: 10px;
        border: 1px solid #333;
        background: #1a1a1a;
        -webkit-overflow-scrolling: touch;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        text-align: center;
        table-layout: fixed;
    }
    
    thead th {
        background: #2a2a2a;
        color: #00ffcc;
        padding: 8px 1px;
        border: 1px solid #333;
        position: sticky;
        top: 0;
        z-index: 100;
        font-size: 9px;
    }
    
    .level-col {
        font-weight: bold;
        background: #222 !important;
        color: #fff;
        position: sticky;
        left: 0;
        z-index: 50;
        width: 35px !important;
        border-right: 2px solid #333 !important;
    }
    
    td {
        padding: 8px 1px;
        border: 1px solid #333;
        color: #444;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* --- レスポンシブ --- */
    @media (max-width: 480px) {
        body { padding: 5px; }
        .target-vf-value { font-size: 20px; }
        table { font-size: 11px; }
        td { padding: 8px 1px; }
    }

    /* --- セルカラー --- */
    .status-deep { color: #fff; font-weight: bold; background: rgba(0, 204, 153, 0.4); } 
    .status-clear { color: #00ffcc; font-weight: bold; background: rgba(0, 255, 204, 0.12); } 
    .status-near { color: #ff8800; font-weight: bold; background: rgba(255, 136, 0, 0.1); } 
    .status-none { color: #444; }
</style>
</head>
<body>

<div class="app-title">VOLFORCE早見表 ver.∇</div>

<div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="menu-trigger" onclick="toggleMenu()">☰</div>
<div class="side-menu" id="sideMenu">
    <div class="menu-title">TOOL MENU</div>
    <ul class="menu-list">
        <li><a onclick="window.open('https://otogetool.wixsite.com/vol-calculator', '_blank')">TOP</a></li>
        <li><a onclick="window.open('https://otogetool.wixsite.com/vol-calculator/vol-to-score', '_blank')">目標スコア算出</a></li>
        <li><a onclick="window.open('https://otogetool.wixsite.com/vol-calculator/solo-vol', '_blank')">単曲VOLFORCE算出</a></li>
        
        <li><a href="#" class="active" onclick="toggleMenu()">VOLFORCE早見表</a></li>
        
        <li style="margin-top: 20px; border-top: 1px solid #333; padding-top: 12px;">
            <a onclick="window.open('https://otogetool.wixsite.com/vol-calculator/rule', '_blank')" style="font-size: 11px; opacity: 0.8;">利用規約</a>
        </li>
        <li>
            <a onclick="window.open('https://otogetool.wixsite.com/vol-calculator/contact', '_blank')" style="font-size: 11px; opacity: 0.8;">お問い合わせ</a>
        </li>
    </ul>
</div>

<div class="header-controls">
    <div class="controls">
        <div class="mode-selector">
            <label><input type="radio" name="fmt" value="std" checked onchange="changeFormat()"><span>総合VF<br><span class="unit-desc">(XX.xxx)</span></span></label>
            <label><input type="radio" name="fmt" value="int" onchange="changeFormat()"><span>公式単曲<br><span class="unit-desc">(XXX)</span></span></label>
            <label><input type="radio" name="fmt" value="p1" onchange="changeFormat()"><span>Tool<br><span class="unit-desc">(XX.x)</span></span></label>
        </div>

        <div class="dropdown-row">
            <div class="control-group">
                <label class="title">表示スコア範囲</label>
                <select id="rangeSel" onchange="render()">
                    <option value="puc_aaa_plus">PUC ～ AAA+</option>
                    <option value="puc_s">PUC ～ S</option>
                    <option value="puc_995">PUC ～ 995k</option>
                </select>
            </div>
            
            <div class="control-group">
                <label class="title">クリアメダル</label>
                <select id="medalSel" onchange="render()">
                    <option value="1.1">PUC</option>
                    <option value="1.06" selected>UC</option>
                    <option value="1.04">MAXXIVE</option>
                    <option value="1.02">EXCESSIVE</option>
                    <option value="1">EFFECTIVE</option>
                </select>
            </div>
            
            <div class="control-group">
                <label class="title">クラス</label>
                <select id="classSel" onchange="updateRankOptions()">
                    <option value="1 Sienna">1 Sienna</option>
                    <option value="2 Cobalt">2 Cobalt</option>
                    <option value="3 Dandelion">3 Dandelion</option>
                    <option value="4 Cyan">4 Cyan</option>
                    <option value="5 Scarlet">5 Scarlet</option>
                    <option value="6 Coral">6 Coral</option>
                    <option value="7 Argento">7 Argento</option>
                    <option value="8 Eldora">8 Eldora</option>
                    <option value="9 Crimson">9 Crimson</option>
                    <option value="10 Imperial" selected>10 Imperial</option>
                </select>
            </div>
            
            <div class="control-group">
                <label class="title">ランク</label>
                <select id="rankSel" onchange="updateByDropdown()">
                </select>
            </div>
            
            <div class="control-group" style="grid-column: span 2;">
                <label class="title">目標VF入力</label>
                <input type="number" id="customVF" value="20.000" step="0.05" min="0" oninput="updateByInput()">
            </div>
        </div>
    </div>

    <div class="target-vf-box">
        <div class="target-vf-label" id="targetLabel">目標 (総合VF)</div>
        <div class="target-vf-value" id="dispVF">0<span class="decimal">.000</span></div>
        <div class="vf-note" id="vfNote">VFは0.05刻みで算出</div>
        <div class="vf-note-special" id="specialNote">※特定域到達のため、全上位譜面のプレー推奨</div>
    </div>
</div>

<div class="table-container">
    <table id="resultTable">
        <thead><tr id="tableHeader"></tr></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script src="common.js" defer></script>
<script>
    function toggleMenu() {
        document.getElementById('sideMenu').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }

    let currentStdVF = 20.000;
    const EPS = 0.000001;

    const VF_MAP = {
        "1 Sienna": [0, 2.5, 5, 7.5], 
        "2 Cobalt": [10, 10.5, 11, 11.5], 
        "3 Dandelion": [12, 12.5, 13, 13.5],
        "4 Cyan": [14, 14.25, 14.5, 14.75], 
        "5 Scarlet": [15, 15.25, 15.5, 15.75], 
        "6 Coral": [16, 16.25, 16.5, 16.75],
        "7 Argento": [17, 17.25, 17.5, 17.75], 
        "8 Eldora": [18, 18.25, 18.5, 18.75], 
        "9 Crimson": [19, 19.25, 19.5, 19.75],
        "10 Imperial": [20, 21, 22, 23]
    };
    const ROMAN = ["I", "II", "III", "IV"];

    const SCORES = {
        puc_aaa_plus: [
            { n: 'PUC', s: 10000000 }, { n: '995k', s: 9950000 }, { n: '990k(S)', s: 9900000 }, 
            { n: '985k', s: 9850000 }, { n: '980k', s: 9800000 }
        ],
        puc_s: [
            { n: 'PUC', s: 10000000 }, { n: '997.5', s: 9975000 }, { n: '995', s: 9950000 },
            { n: '992.5', s: 9925000 }, { n: 'S', s: 9900000 }
        ],
        puc_995: [
            { n: 'PUC', s: 10000000 }, { n: '999', s: 9990000 }, { n: '998', s: 9980000 },
            { n: '997', s: 9970000 }, { n: '996', s: 9960000 }, { n: '995', s: 9950000 }
        ]
    };

    const RANK_FACTORS = [
        { t: 10000000, f: 1.05 }, { t: 9900000, f: 1.05 }, { t: 9800000, f: 1.02 },
        { t: 9700000, f: 1.00 }, { t: 9500000, f: 0.97 }, { t: 9300000, f: 0.94 },
        { t: 9000000, f: 0.91 }, { t: 8700000, f: 0.88 }, { t: 7500000, f: 0.85 },
        { t: 0, f: 0.82 }
    ];

    function updateRankOptions() {
        const classVal = document.getElementById('classSel').value;
        const rankSel = document.getElementById('rankSel');
        const values = VF_MAP[classVal];
        let html = '';
        values.forEach((v, i) => {
            html += `<option value="${v}">${ROMAN[i]}</option>`;
        });
        rankSel.innerHTML = html;
        updateByDropdown();
    }

    function getBaseIntVF(lv, score, selectedMedalFactor) {
        let rankFactor = 0;
        let medalFactor = selectedMedalFactor;
        if (score >= 10000000) {
            rankFactor = 1.05;
            medalFactor = 1.1;
        } else {
            if (selectedMedalFactor === 1.1) return null;
            for (let r of RANK_FACTORS) {
                if (score >= r.t) {
                    rankFactor = r.f;
                    break;
                }
            }
        }
        return Math.floor(lv * (score / 10000000) * rankFactor * medalFactor * 20 + EPS);
    }

    function formatValueForTable(intVF, fmt) {
        if (intVF === null) return "---";
        if (fmt === "int") return intVF.toString();
        if (fmt === "p1") return (intVF / 10).toFixed(1);
        return (intVF / 20).toFixed(2);
    }

    function formatValueForMain(intVF, fmt) {
        if (intVF === null) return "0.000";
        if (fmt === "int") return intVF.toString();
        if (fmt === "p1") return (intVF / 10).toFixed(1);
        return (intVF / 20).toFixed(3);
    }

    function changeFormat() {
        const fmt = document.querySelector('input[name="fmt"]:checked').value;
        const input = document.getElementById('customVF');
        const label = document.getElementById('targetLabel');
        const note = document.getElementById('vfNote');
        const targetInt = Math.floor(currentStdVF * 20 + EPS);
        
        if (fmt === "int") { 
            input.max = "479";
            input.value = Math.min(targetInt, 479);
            input.step = "1";
            label.innerText = "目標 (公式単曲)";
            note.style.display = "none";
        } else if (fmt === "p1") { 
            input.max = "47.9";
            input.value = Math.min((targetInt / 10), 47.9).toFixed(1);
            input.step = "0.1";
            label.innerText = "目標 (Tool)";
            note.style.display = "none";
        } else { 
            input.max = "23.950";
            input.value = Math.min((targetInt / 20), 23.950).toFixed(3);
            input.step = "0.05";
            label.innerText = "目標 (総合VF)";
            note.style.display = "block";
        }
        updateByInput();
    }

    function updateByDropdown() {
        const rankVal = document.getElementById('rankSel').value;
        if (!rankVal) return;
        currentStdVF = parseFloat(rankVal);
        changeFormat();
    }

    function updateByInput() {
        const fmt = document.querySelector('input[name="fmt"]:checked').value;
        const input = document.getElementById('customVF');
        let val = parseFloat(input.value) || 0;
        const maxVal = parseFloat(input.max);
        
        // 入力値の範囲ガード
        if (val > maxVal) {
            val = maxVal;
            input.value = (fmt === "int") ? Math.floor(val) : (fmt === "p1" ? val.toFixed(1) : val.toFixed(3));
        }
        if (val < 0) {
            val = 0;
            input.value = (fmt === "int") ? "0" : (fmt === "p1" ? "0.0" : "0.000");
        }

        if (fmt === "int") {
            currentStdVF = val / 20;
        } else if (fmt === "p1") {
            currentStdVF = (val * 10) / 20;
        } else {
            currentStdVF = val;
        }

        const specialNote = document.getElementById('specialNote');
        if (currentStdVF >= 22.5) {
            specialNote.style.display = "block";
        } else {
            specialNote.style.display = "none";
        }
        render();
    }

    function render() {
        const medalFactor = parseFloat(document.getElementById('medalSel').value);
        const fmt = document.querySelector('input[name="fmt"]:checked').value;
        const rangeKey = document.getElementById('rangeSel').value;
        const activeScores = SCORES[rangeKey];
        const targetIntVF = Math.floor(currentStdVF * 20 + EPS);
        const targetStdVF = currentStdVF;

        document.getElementById('dispVF').innerHTML = formatValueForMain(targetIntVF, fmt).replace(/\.(\d+)/, '<span class="decimal">.$1</span>');

        let headerHtml = '<th class="level-col">Lv</th>';
        activeScores.forEach(s => {
            headerHtml += `<th>${s.n}</th>`;
        });
        document.getElementById('tableHeader').innerHTML = headerHtml;

        let levels = [];
        for (let i = 209; i >= 180; i--) levels.push({ v: i / 10, t: 'f1' });
        levels.push({ v: 17.5, t: 'f1' }, { v: 17.0, t: 'f1' });
        for (let i = 16; i >= 1; i--) levels.push({ v: i, t: 'int' });

        let html = '';
        levels.forEach(lvObj => {
            html += `<tr><td class="level-col">${lvObj.t === 'int' ? lvObj.v : lvObj.v.toFixed(1)}</td>`;
            activeScores.forEach(sc => {
                const intVF = getBaseIntVF(lvObj.v, sc.s, medalFactor);
                if (intVF === null) {
                    html += `<td class="status-none">---</td>`;
                } else {
                    const stdVF = intVF / 20;
                    const diff = stdVF - targetStdVF;
                    let cellClass = "status-none";

                    if (targetStdVF >= 22.5) {
                        if (stdVF >= 23.000) cellClass = "status-deep";
                        else if (stdVF >= 22.650) cellClass = "status-clear";
                        else if (stdVF >= 22.150) cellClass = "status-near";
                    } else {
                        if (diff >= 0.5 && diff <= 1.0) cellClass = "status-deep";
                        else if (diff >= 0 && diff < 0.5) cellClass = "status-clear";
                        else if (diff < 0 && diff >= -0.5) cellClass = "status-near";
                    }
                    html += `<td class="${cellClass}">${formatValueForTable(intVF, fmt)}</td>`;
                }
            });
            html += `</tr>`;
        });
        document.getElementById('tableBody').innerHTML = html;
    }

    updateRankOptions();
</script>
</body>
</html>
