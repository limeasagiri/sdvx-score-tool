<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
    :root {
        --bg-deep: #0a0e0a;
        --army-green: #2d3b2d;
        --neon-lime: #b0ff2e;
        --text-main: #e0eee0;
        --line-sub: rgba(176, 255, 46, 0.1);
        --panel-bg: rgba(20, 30, 20, 0.85);
        --border-color: #2d3b2d;
    }

    body {
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        background-color: var(--bg-deep);
        color: var(--text-main);
        margin: 0;
        padding: 10px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        background-image: 
            linear-gradient(var(--line-sub) 1px, transparent 1px),
            linear-gradient(90deg, var(--line-sub) 1px, transparent 1px);
        background-size: 30px 30px;
    }

    .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        flex-shrink: 0;
        padding: 5px 10px;
        border-bottom: 1px solid var(--neon-lime);
        background: rgba(0, 0, 0, 0.5);
    }
    .app-title { 
        font-size: 15px; 
        font-weight: bold; 
        color: var(--neon-lime); 
        text-shadow: 0 0 10px var(--neon-lime);
        letter-spacing: 1px;
    }
    .app-title small {
        font-size: 9px;
        margin-left: 4px;
        font-weight: normal;
        opacity: 0.8;
    }

    .menu-btn {
        width: 34px; height: 34px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        gap: 4px; cursor: pointer; z-index: 1001;
        background: var(--army-green); 
        clip-path: polygon(0 0, 100% 0, 100% 70%, 70% 100%, 0 100%);
    }
    .menu-btn span { width: 18px; height: 2px; background: var(--neon-lime); border-radius: 1px; }

    .drawer-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.8); display: none; z-index: 999;
        backdrop-filter: blur(4px);
    }
    .drawer-overlay.open { display: block; }

    .drawer {
        position: fixed; top: 0; right: -280px; width: 280px; height: 100vh;
        background: var(--bg-deep); border-left: 2px solid var(--neon-lime);
        z-index: 1000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        padding: 60px 0 20px;
    }
    .drawer.open { right: 0; }
    .menu-label { padding: 15px 25px 5px; font-size: 10px; color: var(--neon-lime); opacity: 0.6; letter-spacing: 2px; font-weight: bold; }
    .menu-item { 
        padding: 16px 25px; border-bottom: 1px solid var(--army-green); 
        color: var(--text-main); font-size: 13px; cursor: pointer;
        display: block; text-decoration: none; transition: 0.2s;
    }
    .menu-item.current {
        background: rgba(176, 255, 46, 0.1) !important;
        color: var(--neon-lime); font-weight: bold;
        border-left: 4px solid var(--neon-lime);
    }

    .view-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-shrink: 0; }
    .tab {
        flex: 1; padding: 10px 2px; background: rgba(45, 59, 45, 0.3); border: 1px solid var(--army-green);
        color: #889988; font-size: 10px; text-align: center; cursor: pointer;
        clip-path: polygon(0 0, 90% 0, 100% 30%, 100% 100%, 0 100%);
        line-height: 1.2; font-weight: bold;
    }
    .tab.active { 
        background: var(--army-green); color: var(--neon-lime); 
        border: 1px solid var(--neon-lime); box-shadow: 0 0 10px rgba(176, 255, 46, 0.2);
    }

    .controls-inner {
        background: var(--panel-bg); padding: 14px; border: 1px solid var(--army-green);
        display: flex; flex-wrap: wrap; gap: 12px;
        clip-path: polygon(0 0, 100% 0, 100% 90%, 97% 100%, 0 100%);
    }
    .control-group { 
        flex: 1; 
        min-width: 140px; 
        display: flex; 
        flex-direction: column; 
        gap: 4px; 
    }
    label.title { font-size: 9px; color: var(--neon-lime); font-weight: bold; letter-spacing: 0.5px; white-space: nowrap; }
    
    select, input {
        padding: 8px; border: 1px solid var(--army-green);
        background: #000; color: #fff; font-size: 13px; /* テキストを白に変更 */
        outline: none; font-family: monospace;
    }
    select:focus, input:focus { border-color: var(--neon-lime); }

    .table-container {
        flex-grow: 1; overflow: auto; border: 1px solid var(--army-green);
        background: rgba(0, 0, 0, 0.6); margin-top: 10px;
    }
    table { border-collapse: collapse; font-size: 11px; text-align: center; table-layout: fixed; width: max-content; min-width: 100%; }
    thead th {
        background: var(--army-green); color: var(--neon-lime); padding: 10px 8px;
        position: sticky; top: 0; z-index: 100; border: 1px solid var(--bg-deep);
    }
    .level-col {
        background: #000 !important; color: var(--neon-lime); font-weight: 900;
        position: sticky; left: 0; z-index: 110; border-right: 2px solid var(--neon-lime) !important;
        text-shadow: 0 0 5px var(--neon-lime);
    }
    td { padding: 10px 2px; border: 1px solid var(--army-green); }

    .cell-content { display: flex; flex-direction: column; line-height: 1.3; }
    .main-line { font-weight: bold; font-family: monospace; }
    .sub-line { font-size: 8px; opacity: 0.6; margin-top: 2px; }
    .ref-line { font-size: 14px; color: var(--army-green); }

    .eff-active { color: #88cc88; }
    .exc-active { color: #aa88ff; }
    .max-active { color: #aab8aa; }
    .uc-active  { color: #ff88aa; }
    .puc-active { color: #ffff88; font-style: italic; text-shadow: 0 0 5px rgba(255, 255, 136, 0.5); }
    .rank-aaa-dim { opacity: 0.5; font-weight: normal !important; }
    .val-none { color: #222 !important; }
    .step-hint { font-size: 8px; color: #556655; margin-top: 2px; }
</style>
</head>
<body>

<div class="header-bar">
    <div class="app-title">スコア・VF早見表 <small>ver.∇</small></div>
    <div class="menu-btn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>
</div>

<div class="drawer-overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="drawer" id="drawer">
    <div class="menu-label">TOP MENU</div> <a href="index.html" class="menu-item">TOPページへ戻る</a>
    
    <div class="menu-label">NAVIGATOR</div>
    <a href="vol-to-score.html" class="menu-item">目標スコア算出</a>
    <div class="menu-item current" onclick="toggleMenu()">スコア・VF早見表</div>
    <a href="solo-vol.html" class="menu-item">単曲VF計算</a>
    <a href="vol-hayami.html" class="menu-item">VF到達目安表</a>
    
    <div class="menu-label">INFORMATION</div>
    <a href="/rule" class="menu-item">利用規約</a>
    <a href="/contact" class="menu-item">お問い合わせ</a>
</div>

<div class="view-tabs" id="viewTabs">
    <div class="tab active" data-mode="total" onclick="switchView('total')">TOTAL<br>(XX.xxx)</div>
    <div class="tab" data-mode="single" onclick="switchView('single')">SINGLE<br>(XXX)</div>
    <div class="tab" data-mode="tool" onclick="switchView('tool')">TOOL<br>(XX.x)</div>
</div>

<div class="header-controls">
    <div class="controls-inner">
        <div class="control-group">
            <label class="title">目標VF CLASS / Rank</label>
            <div style="display: flex; gap: 4px;">
                <select id="vfRank" onchange="applyRankClass()" style="flex: 2;">
                    <option value="1">1 Sienna</option>
                    <option value="2">2 Cobalt</option>
                    <option value="3">3 Dandelion</option>
                    <option value="4">4 Cyan</option>
                    <option value="5">5 Scarlet</option>
                    <option value="6">6 Coral</option>
                    <option value="7">7 Argento</option>
                    <option value="8">8 Eldora</option>
                    <option value="9">9 Crimson</option>
                    <option value="10" selected>10 Imperial</option>
                </select>
                <select id="vfClass" onchange="applyRankClass()" style="flex: 1;">
                    <option value="0" selected>I</option>
                    <option value="1">II</option>
                    <option value="2">III</option>
                    <option value="3">IV</option>
                </select>
            </div>
        </div>

        <div class="control-group">
            <label class="title" id="targetLabel">目標VF(自由入力)</label>
            <input type="number" id="targetInput" value="20.00" step="0.05" min="0.05" max="24.10" onchange="render()">
            <div class="step-hint" id="stepGuide">STEP: 0.05 increments</div>
        </div>

        <div class="control-group">
            <label class="title">参照MEDAL</label>
            <select id="medal" onchange="render()">
                <option value="PUC">PUC</option>
                <option value="UC">UC</option>
                <option value="MAXXIVE" selected>MAXXIVE</option>
                <option value="EXCESSIVE">EXCESSIVE</option>
                <option value="EFFECTIVE">EFFECTIVE</option>
            </select>
        </div>
    </div>
</div>

<div class="table-container">
    <table>
        <thead><tr id="headerRow"></tr></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
let currentViewMode = 'total';

function toggleMenu() {
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    drawer.classList.toggle('open');
    overlay.classList.toggle('open');
}

const RANK_DATA = {
    "1 Sienna": [0.05, 2.5, 5, 7.5],
    "2 Cobalt": [10, 10.5, 11, 11.5],
    "3 Dandelion": [12, 12.5, 13, 13.5],
    "4 Cyan": [14, 14.25, 14.5, 14.75],
    "5 Scarlet": [15, 15.25, 15.5, 15.75],
    "6 Coral": [16, 16.25, 16.5, 16.75],
    "7 Argento": [17, 17.25, 17.5, 17.75],
    "8 Eldora": [18, 18.25, 18.5, 18.75],
    "9 Crimson": [19, 19.25, 19.5, 19.75],
    "10 Imperial": [20, 21, 22, 23]
};

function applyRankClass() {
    const rankSelect = document.getElementById('vfRank');
    const rankName = rankSelect.options[rankSelect.selectedIndex].text;
    const classIdx = parseInt(document.getElementById('vfClass').value);
    let totalVF = RANK_DATA[rankName][classIdx];
    if (totalVF > 24.1) totalVF = 24.1;
    const input = document.getElementById('targetInput');
    if (currentViewMode === 'total') input.value = totalVF.toFixed(2);
    else if (currentViewMode === 'single') input.value = Math.round(totalVF * 20);
    else if (currentViewMode === 'tool') input.value = (totalVF * 2).toFixed(1);
    render();
}

function switchView(mode) {
    const prevMode = currentViewMode;
    const input = document.getElementById('targetInput');
    const guide = document.getElementById('stepGuide');
    let val = parseFloat(input.value);
    let totalVF = (prevMode === 'total') ? val : (prevMode === 'single') ? val / 20 : val / 2;
    currentViewMode = mode;
    if (mode === 'total') {
        input.value = totalVF.toFixed(2); input.step = "0.05"; input.max = "24.10";
        guide.innerText = "STEP: 0.05 increments";
    } else if (mode === 'single') {
        input.value = Math.round(totalVF * 20); input.step = "1"; input.max = "482";
        guide.innerText = "STEP: 1 increments";
    } else if (mode === 'tool') {
        input.value = (totalVF * 2).toFixed(1); input.step = "0.1"; input.max = "48.2";
        guide.innerText = "STEP: 0.1 increments";
    }
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab[data-mode="${mode}"]`).classList.add('active');
    render();
}

function formatVF(totalVF) {
    if (currentViewMode === 'total') return totalVF.toFixed(3);
    if (currentViewMode === 'single') return Math.floor(totalVF * 20).toString();
    if (currentViewMode === 'tool') return (totalVF * 2).toFixed(1);
    return totalVF.toFixed(2);
}

const MEDALS = ["EFFECTIVE", "EXCESSIVE", "MAXXIVE", "UC", "PUC"];
const MEDAL_COEF = { "EFFECTIVE": 1.0, "EXCESSIVE": 1.02, "MAXXIVE": 1.04, "UC": 1.06, "PUC": 1.1 };
const CLASS_MAP = { "EFFECTIVE": "eff-active", "EXCESSIVE": "exc-active", "MAXXIVE": "max-active", "UC": "uc-active", "PUC": "puc-active" };

function getLevelList() {
    let list = [];
    for (let i = 209; i >= 180; i--) list.push((i / 10).toFixed(1));
    list.push("17.5", "17.0");
    for (let i = 16; i >= 1; i--) list.push(i.toString());
    return list;
}

function getRequired(lv, targetVF, medal, isBaseMedal) {
    const m = MEDAL_COEF[medal];
    const vfAtPUC = Math.floor(lv * 1.05 * 1.1 * 20) / 20;
    
    if (isBaseMedal && medal === "PUC") {
        if (vfAtPUC >= targetVF) return { rank: "PUC", medal: "PUC", vf: vfAtPUC, priority: 100, isAAA: false };
        return null;
    }

    const sScore = Math.ceil((targetVF * 10000000) / (lv * 1.05 * m));
    const aaaPlusScore = Math.ceil((targetVF * 10000000) / (lv * 1.02 * m));

    if (isBaseMedal) {
        if (aaaPlusScore >= 9800000 && aaaPlusScore < 9900000) return { rank: (aaaPlusScore === 9800000) ? "AAA+" : aaaPlusScore.toLocaleString(), medal: medal, vf: targetVF, priority: 10, isAAA: true };
        if (sScore >= 9900000 && sScore < 10000000) return { rank: (sScore === 9900000) ? "S" : sScore.toLocaleString(), medal: medal, vf: targetVF, priority: 20, isAAA: false };
        
        if (aaaPlusScore < 9800000 && (Math.floor(lv * 1.02 * m * 20) / 20) >= targetVF) {
            return { rank: "AAA+", medal: medal, vf: Math.floor(lv * 1.02 * m * 0.98 * 20) / 20, priority: 15, isAAA: true };
        }
        if (sScore < 9900000 && (Math.floor(lv * 1.05 * m * 20) / 20) >= targetVF) {
            return { rank: "S", medal: medal, vf: Math.floor(lv * 1.05 * m * 0.99 * 20) / 20, priority: 25, isAAA: false };
        }
    } else {
        if (medal === "PUC" && vfAtPUC >= targetVF) return { rank: "PUC", medal: "PUC", vf: vfAtPUC, priority: 100, isAAA: false };
        if (medal !== "PUC" && (Math.floor(lv * 1.05 * m * 0.99 * 20) / 20) >= targetVF) {
            return { rank: "S+ " + medal, medal: medal, vf: Math.floor(lv * 1.05 * m * 0.99 * 20) / 20, priority: 50, isAAA: false };
        }
    }
    return null;
}

function render() {
    let inputVal = parseFloat(document.getElementById('targetInput').value);
    if (isNaN(inputVal) || inputVal < 0.05) inputVal = 0.05;
    let target = (currentViewMode === 'total') ? Math.min(inputVal, 24.1) : (currentViewMode === 'single') ? Math.min(inputVal, 482) / 20 : Math.min(inputVal, 48.2) / 2;
    document.getElementById('targetInput').value = inputVal;
    const baseMedal = document.getElementById('medal').value;
    const baseIdx = MEDALS.indexOf(baseMedal);
    const tBody = document.getElementById('tableBody');
    const hRow = document.getElementById('headerRow');
    let vfCols = [];
    let hHtml = '<th class="level-col">LV / VF</th>';
    for(let i=10; i>=-10; i--) {
        let v = Math.max(0.05, Math.min(24.1, parseFloat((target + (i * 0.05)).toFixed(2))));
        vfCols.push(v);
        hHtml += `<th>${formatVF(v)}</th>`;
    }
    hRow.innerHTML = hHtml;
    let bHtml = '';
    getLevelList().forEach(lvStr => {
        const lv = parseFloat(lvStr);
        let rowHtml = `<td class="level-col">${lvStr}</td>`;
        let prev = null; let hasData = false; let cellsHtml = '';
        vfCols.forEach((colVF, idx) => {
            let options = [];
            for (let i = baseIdx; i < MEDALS.length; i++) {
                let r = getRequired(lv, colVF, MEDALS[i], i === baseIdx);
                if (r) options.push(r);
            }
            let current = options.length > 0 ? options.sort((a,b) => a.priority - b.priority)[0] : null;
            let cls = "val-none"; let content = "-";
            if (current) {
                hasData = true;
                if (idx !== 10 && prev && current.rank === prev.rank && current.medal === prev.medal) content = `<span class="ref-line">←</span>`;
                else {
                    cls = (CLASS_MAP[current.medal] || "") + (current.isAAA ? " rank-aaa-dim" : "");
                    content = `<div class="cell-content"><span class="main-line">${current.rank}</span><span class="sub-line">(${formatVF(current.vf)})</span></div>`;
                }
            }
            cellsHtml += `<td class="${cls}">${content}</td>`;
            prev = current;
        });
        if (hasData) bHtml += `<tr>${rowHtml}${cellsHtml}</tr>`;
    });
    tBody.innerHTML = bHtml;
}
window.onload = render;
</script>
</body>
</html>
