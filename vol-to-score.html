<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目標スコア算出 - VOLFORCE CALC ∇</title>
    <style>
        :root {
            --bg-deep: #0a0e0a;
            --army-green: #2d3b2d;
            --neon-lime: #b0ff2e;
            --text-main: #e0eee0;
            --line-sub: rgba(176, 255, 46, 0.15);
            --card-bg: rgba(20, 30, 20, 0.85);
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            margin: 0;
            background-image: 
                linear-gradient(var(--line-sub) 1px, transparent 1px),
                linear-gradient(90deg, var(--line-sub) 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- ヘッダー --- */
        header {
            padding: 15px 0;
            text-align: center;
            border-bottom: 2px solid var(--neon-lime);
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        header h1 {
            margin: 0;
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--neon-lime);
            text-shadow: 0 0 10px var(--neon-lime);
        }

        .menu-trigger {
            position: absolute;
            right: 20px;
            background: var(--army-green);
            color: var(--neon-lime);
            border: 1px solid var(--neon-lime);
            width: 38px;
            height: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            z-index: 1100;
        }

        .side-menu {
            position: fixed;
            top: 0; right: -300px; width: 280px; height: 100%;
            background: rgba(10, 14, 10, 0.98);
            z-index: 1200;
            transition: 0.4s;
            border-left: 1px solid var(--neon-lime);
            padding: 80px 0 20px;
        }
        .side-menu.open { right: 0; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 1150; }
        .menu-overlay.show { display: block; }
        .menu-label { padding: 15px 25px 5px; font-size: 0.7rem; color: var(--neon-lime); opacity: 0.6; letter-spacing: 2px; }
        .menu-item { padding: 15px 25px; display: block; color: var(--text-main); text-decoration: none; font-size: 0.95rem; border-bottom: 1px solid rgba(176, 255, 46, 0.1); }
        .menu-item.current { border-left: 4px solid var(--neon-lime); background: rgba(176, 255, 46, 0.1); color: var(--neon-lime); font-weight: bold; }

        /* --- コンテンツ --- */
        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            max-width: 1000px;
            margin: 0 auto;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }

        .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; margin-bottom: 10px; flex-shrink: 0; }
        .panel { background: var(--card-bg); border: 1px solid var(--army-green); padding: 10px; clip-path: polygon(0 0, 98% 0, 100% 10%, 100% 100%, 2% 100%, 0 90%); }
        .vf-value { font-size: 2rem; font-weight: bold; color: var(--neon-lime); line-height: 1.2; }
        
        .input-title { display: block; font-size: 0.65rem; color: var(--neon-lime); margin-bottom: 3px; letter-spacing: 0.5px; white-space: nowrap; }
        
        select, input { padding: 6px; background: #000; border: 1px solid var(--army-green); color: white; font-size: 0.85rem; width: 100%; box-sizing: border-box; }
        
        .mode-selector { display: flex; gap: 2px; margin-bottom: 8px; }
        .mode-selector input[type="radio"] { display: none; }
        .mode-selector label { 
            flex: 1; 
            text-align: center; 
            background: #1a1a1a; 
            padding: 6px 0; 
            border: 1px solid var(--army-green); 
            cursor: pointer; 
            font-size: 0.65rem; 
            color: var(--text-main);
        }
        .mode-selector label:has(input:checked) { 
            border-color: var(--neon-lime); 
            background: rgba(176, 255, 46, 0.2); 
            color: var(--neon-lime);
            font-weight: bold;
        }

        .flex-row { display: flex; gap: 8px; align-items: flex-end; }

        /* --- テーブル --- */
        .table-wrapper {
            flex-grow: 1;
            overflow: auto;
            border: 1px solid var(--army-green);
            background: rgba(0, 0, 0, 0.8);
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.85rem; min-width: 500px; }
        
        th {
            background: var(--army-green);
            color: var(--neon-lime);
            padding: 10px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--neon-lime);
        }

        td { padding: 8px; border-bottom: 1px solid rgba(176, 255, 46, 0.1); border-right: 1px solid rgba(176, 255, 46, 0.1); text-align: center; }
        .level-cell { 
            font-weight: bold; 
            background-color: #111811; 
            position: sticky; 
            left: 0; 
            z-index: 5;
            border-right: 1px solid rgba(176, 255, 46, 0.4); 
        }

        /* スコア配色 */
        .val-none { color: #444; }
        .val-low-score { color: #666; }
        .eff-mid { color: #66ff66; font-weight: bold; }
        .eff-high { color: #00ff00; font-weight: bold; text-shadow: 0 0 5px rgba(0,255,0,0.5); }
        .exc-mid { color: #9966ff; font-weight: bold; }
        .exc-high { color: #cc33ff; font-weight: bold; text-shadow: 0 0 5px rgba(204,51,255,0.5); }
        .max-mid { color: #eeeeee; font-weight: bold; }
        .max-high { color: #ffffff; font-weight: bold; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .uc-mid { color: #ff66aa; font-weight: bold; }
        .uc-high { color: #ff3399; font-weight: bold; text-shadow: 0 0 5px rgba(255,51,153,0.5); }
        .puc-active { color: #ffff00; font-weight: bold; font-style: italic; text-shadow: 0 0 8px rgba(255,255,0,0.5); }

        footer { padding: 10px; text-align: center; font-size: 0.7rem; opacity: 0.5; flex-shrink: 0; }
    </style>
</head>
<body>

<div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>

<header>
    <h1>目標スコア算出 <span style="font-size: 0.7em; opacity: 0.8; margin-left: 5px;">ver.∇</span></h1>
    <div class="menu-trigger" onclick="toggleMenu()">☰</div>
</header>

<div class="side-menu" id="sideMenu">
    <div class="menu-label">Navi</div>
    <a href="index.html" class="menu-item">TOPページ</a>
    <a href="vol-to-score.html" class="menu-item current">目標スコア算出</a>
    <a href="score-hayami.html" class="menu-item">目標スコア早見表</a>
    <a href="solo-vol.html" class="menu-item">単曲VOLFORCE算出</a>
    <a href="vol-hayami.html" class="menu-item">VOLFORCE早見表</a>
</div>

<div class="main-container">
    <div class="controls-grid">
        <div class="panel">
            <span class="input-title">表示・計算方式</span>
            <div class="mode-selector">
                <label><input type="radio" name="fmt" value="std" checked onchange="changeFormat()"><span id="label-std">総合VF</span></label>
                <label><input type="radio" name="fmt" value="int" onchange="changeFormat()"><span id="label-int">公式単曲</span></label>
                <label><input type="radio" name="fmt" value="p1" onchange="changeFormat()"><span id="label-p1">Tool値</span></label>
            </div>
            
            <div class="flex-row">
                <div style="flex: 2;">
                    <span class="input-title">目標VF CLASS / Rank</span>
                    <div style="display: flex; gap: 4px;">
                        <select id="classSel" onchange="updateByDropdown()">
                            <option value="1 Sienna">1 Sienna</option><option value="2 Cobalt">2 Cobalt</option><option value="3 Dandelion">3 Dandelion</option>
                            <option value="4 Cyan">4 Cyan</option><option value="5 Scarlet">5 Scarlet</option><option value="6 Coral">6 Coral</option>
                            <option value="7 Argento">7 Argento</option><option value="8 Eldora">8 Eldora</option><option value="9 Crimson">9 Crimson</option>
                            <option value="10 Imperial" selected>10 Imperial</option>
                        </select>
                        <select id="stepSel" onchange="updateByDropdown()" style="width: 60px;">
                            <option value="0">I</option><option value="1">II</option><option value="2">III</option><option value="3">IV</option>
                        </select>
                    </div>
                </div>
                <div style="flex: 1.2;">
                    <span class="input-title">目標VF(自由入力)</span>
                    <input type="number" id="customVF" step="0.05" oninput="updateByInput()" placeholder="値">
                </div>
            </div>
        </div>

        <div class="panel" style="display: flex; flex-direction: column; justify-content: center;">
            <span class="input-title">目標単曲VOLFORCE</span>
            <div class="vf-value" id="dispVF">0.000</div>
            <div style="font-size: 0.7rem; opacity: 0.6;" id="rawVF">総合換算: ---</div>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="resultTable">
            <thead>
                <tr>
                    <th style="width: 45px;">Lv</th>
                    <th>EFF</th>
                    <th>EXC</th>
                    <th>MAX</th>
                    <th>UC</th>
                    <th>PUC</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<footer>©2026 sdvx-sco-vol-tool</footer>

<script>
function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
}

const VF_MAP = {
    "1 Sienna": [0, 2.5, 5, 7.5], "2 Cobalt": [10, 10.5, 11, 11.5], "3 Dandelion": [12, 12.5, 13, 13.5],
    "4 Cyan": [14, 14.25, 14.5, 14.75], "5 Scarlet": [15, 15.25, 15.5, 15.75], "6 Coral": [16, 16.25, 16.5, 16.75],
    "7 Argento": [17, 17.25, 17.5, 17.75], "8 Eldora": [18, 18.25, 18.5, 18.75], "9 Crimson": [19, 19.25, 19.5, 19.75],
    "10 Imperial": [20, 21, 22, 23]
};

let currentStandardVF = 20.000;

function solveFromSheetFormula(targetVF, lv, mCoef) {
    if (targetVF <= 0) return 0;
    const calc = (rCoef) => (targetVF * 10000000) / (lv * rCoef * mCoef);
    let res = calc(1.05);
    if (res > 9900000) return Math.round(res);
    if (res < 9900000 && calc(1.02) > 9900000) return 9900000;
    res = calc(1.02);
    if (res > 9800000) return Math.round(res);
    if (res < 9800000 && calc(1.00) > 9800000) return 9800000;
    res = calc(1.00);
    if (res > 9700000) return Math.round(res);
    if (res < 9700000 && calc(0.97) > 9700000) return 9700000;
    res = calc(0.97);
    if (res > 9500000) return Math.round(res);
    if (res < 9500000 && calc(0.94) > 9500000) return 9500000;
    res = calc(0.94);
    if (res > 9300000) return Math.round(res);
    if (res < 9300000 && calc(0.91) > 9300000) return 9300000;
    res = calc(0.91);
    if (res > 9000000) return Math.round(res);
    if (res < 9000000 && calc(0.88) > 9000000) return 9000000;
    res = calc(0.88);
    if (res > 8700000) return Math.round(res);
    if (res < 8700000 && calc(0.85) > 8700000) return 8700000;
    res = calc(0.85);
    if (res > 7500000) return Math.round(res);
    if (res < 7500000 && calc(0.82) > 7500000) return 7500000;
    res = calc(0.82);
    if (res > 6500000) return Math.round(res);
    res = calc(0.80);
    return res > 0 ? Math.round(res) : null;
}

function getFormat() { return document.querySelector('input[name="fmt"]:checked').value; }

function changeFormat() {
    const fmt = getFormat();
    const input = document.getElementById('customVF');
    if (fmt === "int") { input.value = Math.floor(currentStandardVF * 20); input.step = "1"; }
    else if (fmt === "p1") { input.value = (currentStandardVF * 2).toFixed(1); input.step = "0.1"; }
    else { input.value = currentStandardVF.toFixed(3); input.step = "0.05"; }
    render();
}

function getScoreClass(val, prefix) {
    if (!val || val >= 10000000) return "val-none"; 
    if (val < 9800000) return "val-low-score"; 
    if (val >= 9950000) return prefix + "-high";
    if (val >= 9900000) return prefix + "-mid";
    return "";
}

function render() {
    const fmt = getFormat();
    const vf = Math.floor((currentStandardVF + 0.00001) / 0.05) * 0.05;
    let dispVal = (fmt === "int") ? Math.floor(vf * 20) : (fmt === "p1") ? (vf * 2).toFixed(1) : vf.toFixed(3);
    document.getElementById('dispVF').innerText = dispVal;
    document.getElementById('rawVF').innerText = `総合換算: ${currentStandardVF.toFixed(3)}`;

    let levels = [];
    for (let l = 20.9; l >= 18.0; l = Math.round((l - 0.1) * 10) / 10) { levels.push(l); }
    levels.push(17.5, 17.0);
    for (let l = 16.0; l >= 1.0; l--) { levels.push(l); }

    let html = '';
    levels.forEach(lv => {
        // 各項目の計算結果を取得
        const resEff = solveFromSheetFormula(vf, lv, 1.00);
        const resExc = solveFromSheetFormula(vf, lv, 1.02);
        const resMax = solveFromSheetFormula(vf, lv, 1.04);
        const resUc  = solveFromSheetFormula(vf, lv, 1.06);
        const canReachPUC = (lv * 1.05 * 1.10) >= (vf - 0.0001);
        
        // 数値をテキスト形式に変換
        const formatScore = (val) => (val && val < 10000000) ? val.toLocaleString() : "---";
        const txtEff = formatScore(resEff);
        const txtExc = formatScore(resExc);
        const txtMax = formatScore(resMax);
        const txtUc  = formatScore(resUc);
        const txtPuc = canReachPUC ? "10,000,000" : "---";

        // すべての項目が "---" であれば、この行そのものを生成しない
        if (txtEff === "---" && txtExc === "---" && txtMax === "---" && txtUc === "---" && txtPuc === "---") {
            return;
        }

        // 行の生成（算出したテキストを適用）
        const pucCls = (canReachPUC && resUc && resUc >= 9950000) ? "puc-active" : "val-low-score";
        
        html += `<tr><td class="level-cell">${lv % 1 === 0 ? lv.toFixed(0) : lv.toFixed(1)}</td>`;
        html += `<td class="${getScoreClass(resEff, 'eff')}">${txtEff}</td>`;
        html += `<td class="${getScoreClass(resExc, 'exc')}">${txtExc}</td>`;
        html += `<td class="${getScoreClass(resMax, 'max')}">${txtMax}</td>`;
        html += `<td class="${getScoreClass(resUc, 'uc')}">${txtUc}</td>`;
        html += `<td class="${pucCls}">${txtPuc}</td></tr>`;
    });
    document.getElementById('tableBody').innerHTML = html;
}

function updateByDropdown() {
    currentStandardVF = VF_MAP[document.getElementById('classSel').value][document.getElementById('stepSel').value];
    changeFormat();
}

function updateByInput() {
    const input = document.getElementById('customVF');
    const fmt = getFormat();
    let val = parseFloat(input.value);
    if (isNaN(val)) return;
    currentStandardVF = (fmt === "int") ? val / 20 : (fmt === "p1") ? val / 2 : val;
    if (currentStandardVF < 0) currentStandardVF = 0;
    if (currentStandardVF > 25) currentStandardVF = 25;
    render();
}
updateByDropdown();
</script>
</body>
</html>
