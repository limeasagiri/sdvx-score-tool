<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目標スコア算出 - VOLFORCE CALC ∇</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* このページ固有のレイアウトのみ記述 */
        .main-container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
        .panel { 
            background: var(--panel-bg); 
            border: 1px solid var(--border-color); 
            padding: 15px; 
            clip-path: polygon(0 0, 98% 0, 100% 10%, 100% 100%, 2% 100%, 0 90%); 
        }
        .vf-value { font-size: 2.2rem; font-weight: bold; color: var(--neon-lime); text-shadow: 0 0 10px rgba(176, 255, 46, 0.3); }
        .input-title { display: block; font-size: 0.7rem; color: var(--neon-lime); margin-bottom: 5px; letter-spacing: 1px; }
        select, input { padding: 8px; background: #000; border: 1px solid var(--army-green); color: white; font-size: 0.9rem; width: 100%; box-sizing: border-box; }
        .mode-selector { display: flex; gap: 4px; margin-bottom: 10px; }
        .mode-selector label { flex: 1; text-align: center; background: #1a1a1a; padding: 8px 0; border: 1px solid var(--army-green); cursor: pointer; font-size: 0.7rem; }
        .mode-selector input { display: none; }
        .mode-selector label:has(input:checked) { border-color: var(--neon-lime); background: rgba(176, 255, 46, 0.15); color: var(--neon-lime); font-weight: bold; }
        .table-wrapper { overflow: auto; border: 1px solid var(--border-color); background: rgba(0,0,0,0.3); margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 600px; }
        th { background: var(--army-green); color: var(--neon-lime); padding: 12px; position: sticky; top: 0; border-bottom: 1px solid var(--neon-lime); z-index: 10; }
        td { padding: 10px; border-bottom: 1px solid rgba(176, 255, 46, 0.1); text-align: center; }
        .level-cell { font-weight: bold; background: rgba(10, 20, 10, 0.9); position: sticky; left: 0; border-right: 1px solid var(--army-green); z-index: 5; }

        /* スコア配色 */
        .val-none { color: #444; }
        .val-low-score { color: #666; }
        .eff-mid { color: #66ff66; font-weight: bold; }
        .eff-high { color: #00ff00; font-weight: bold; text-shadow: 0 0 5px rgba(0,255,0,0.5); }
        .exc-mid { color: #9966ff; font-weight: bold; }
        .exc-high { color: #cc33ff; font-weight: bold; text-shadow: 0 0 5px rgba(204,51,255,0.5); }
        .max-mid { color: #eeeeee; font-weight: bold; }
        .max-high { color: #ffffff; font-weight: bold; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .uc-mid { color: #ff66aa; font-weight: bold; }
        .uc-high { color: #ff3399; font-weight: bold; text-shadow: 0 0 5px rgba(255,51,153,0.5); }
        .puc-active { color: #ffff00; font-weight: bold; font-style: italic; text-shadow: 0 0 8px rgba(255,255,0,0.5); }
    </style>
</head>
<body>

<div class="main-container">
    <div class="controls-grid">
        <div class="panel">
            <span class="input-title">表示・計算方式</span>
            <div class="mode-selector">
                <label><input type="radio" name="fmt" value="std" checked onchange="changeFormat()"><span>総合VF</span></label>
                <label><input type="radio" name="fmt" value="int" onchange="changeFormat()"><span>公式単曲</span></label>
                <label><input type="radio" name="fmt" value="p1" onchange="changeFormat()"><span>Tool値</span></label>
            </div>
            <div class="flex-row" style="display: flex; gap: 8px; align-items: flex-end;">
                <div style="flex: 2;">
                    <span class="input-title">目標VF CLASS / Rank</span>
                    <div style="display: flex; gap: 4px;">
                        <select id="classSel" onchange="updateByDropdown()">
                            <option value="1 Sienna">1 Sienna</option><option value="2 Cobalt">2 Cobalt</option><option value="3 Dandelion">3 Dandelion</option>
                            <option value="4 Cyan">4 Cyan</option><option value="5 Scarlet">5 Scarlet</option><option value="6 Coral">6 Coral</option>
                            <option value="7 Argento">7 Argento</option><option value="8 Eldora">8 Eldora</option><option value="9 Crimson">9 Crimson</option>
                            <option value="10 Imperial" selected>10 Imperial</option>
                        </select>
                        <select id="stepSel" onchange="updateByDropdown()" style="width: 70px;">
                            <option value="0">I</option><option value="1">II</option><option value="2">III</option><option value="3">IV</option>
                        </select>
                    </div>
                </div>
                <div style="flex: 1.2;">
                    <span class="input-title">目標VF(自由入力)</span>
                    <input type="number" id="customVF" step="0.05" oninput="updateByInput()" placeholder="値">
                </div>
            </div>
        </div>
        <div class="panel" style="display: flex; flex-direction: column; justify-content: center;">
            <span class="input-title">目標単曲VOLFORCE</span>
            <div class="vf-value" id="dispVF">0.000</div>
            <div style="font-size: 0.7rem; opacity: 0.6;" id="rawVF">総合換算: ---</div>
        </div>
    </div>
    <div class="table-wrapper">
        <table id="resultTable">
            <thead>
                <tr>
                    <th style="width: 60px;">Lv.</th>
                    <th>EFFECTIVE</th>
                    <th>EXCESSIVE</th>
                    <th>MAXXIVE</th>
                    <th>UC</th>
                    <th>PUC</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script src="common.js"></script>
<script>
const VF_MAP = {
    "1 Sienna": [0, 2.5, 5, 7.5], "2 Cobalt": [10, 10.5, 11, 11.5], "3 Dandelion": [12, 12.5, 13, 13.5],
    "4 Cyan": [14, 14.25, 14.5, 14.75], "5 Scarlet": [15, 15.25, 15.5, 15.75], "6 Coral": [16, 16.25, 16.5, 16.75],
    "7 Argento": [17, 17.25, 17.5, 17.75], "8 Eldora": [18, 18.25, 18.5, 18.75], "9 Crimson": [19, 19.25, 19.5, 19.75],
    "10 Imperial": [20, 21, 22, 23]
};
let currentStandardVF = 20.000;
function solveFromSheetFormula(targetVF, lv, mCoef) {
    if (targetVF <= 0) return 0;
    const calc = (rCoef) => (targetVF * 10000000) / (lv * rCoef * mCoef);
    let res = calc(1.05);
    if (res > 9900000) return Math.round(res);
    if (res < 9900000 && calc(1.02) > 9900000) return 9900000;
    res = calc(1.02);
    if (res > 9800000) return Math.round(res);
    if (res < 9800000 && calc(1.00) > 9800000) return 9800000;
    res = calc(1.00);
    if (res > 9700000) return Math.round(res);
    if (res < 9700000 && calc(0.97) > 9700000) return 9700000;
    res = calc(0.97);
    if (res > 9500000) return Math.round(res);
    if (res < 9500000 && calc(0.94) > 9500000) return 9500000;
    res = calc(0.94);
    if (res > 9300000) return Math.round(res);
    if (res < 9300000 && calc(0.91) > 9300000) return 9300000;
    res = calc(0.91);
    if (res > 9000000) return Math.round(res);
    if (res < 9000000 && calc(0.88) > 9000000) return 9000000;
    res = calc(0.88);
    if (res > 8700000) return Math.round(res);
    if (res < 8700000 && calc(0.85) > 8700000) return 8700000;
    res = calc(0.85);
    if (res > 7500000) return Math.round(res);
    if (res < 7500000 && calc(0.82) > 7500000) return 7500000;
    res = calc(0.82);
    if (res > 6500000) return Math.round(res);
    res = calc(0.80);
    return res > 0 ? Math.round(res) : null;
}
function getFormat() { return document.querySelector('input[name="fmt"]:checked').value; }
function changeFormat() {
    const fmt = getFormat();
    const input = document.getElementById('customVF');
    if (fmt === "int") { input.value = Math.floor(currentStandardVF * 20); input.step = "1"; }
    else if (fmt === "p1") { input.value = (currentStandardVF * 2).toFixed(1); input.step = "0.1"; }
    else { input.value = currentStandardVF.toFixed(3); input.step = "0.05"; }
    render();
}
function getScoreClass(val, prefix) {
    if (!val || val >= 10000000) return "val-none"; 
    if (val < 9800000) return "val-low-score"; 
    if (val >= 9950000) return prefix + "-high";
    if (val >= 9900000) return prefix + "-mid";
    return "";
}
function render() {
    const fmt = getFormat();
    const vf = Math.floor((currentStandardVF + 0.00001) / 0.05) * 0.05;
    let dispVal = (fmt === "int") ? Math.floor(vf * 20) : (fmt === "p1") ? (vf * 2).toFixed(1) : vf.toFixed(3);
    document.getElementById('dispVF').innerText = dispVal;
    document.getElementById('rawVF').innerText = `総合換算: ${currentStandardVF.toFixed(3)}`;
    let levels = [];
    for (let l = 20.9; l >= 18.0; l = Math.round((l - 0.1) * 10) / 10) { levels.push(l); }
    levels.push(17.5, 17.0);
    for (let l = 16.0; l >= 1.0; l--) { levels.push(l); }
    let html = '';
    levels.forEach(lv => {
        const resEff = solveFromSheetFormula(vf, lv, 1.00);
        const resExc = solveFromSheetFormula(vf, lv, 1.02);
        const resMax = solveFromSheetFormula(vf, lv, 1.04);
        const resUc  = solveFromSheetFormula(vf, lv, 1.06);
        const canReachPUC = (lv * 1.05 * 1.10) >= (vf - 0.0001);
        const formatScore = (val) => (val && val < 10000000) ? val.toLocaleString() : "---";
        const txtPuc = canReachPUC ? "10,000,000" : "---";
        if (formatScore(resEff) === "---" && formatScore(resExc) === "---" && formatScore(resMax) === "---" && formatScore(resUc) === "---" && txtPuc === "---") return;
        const pucCls = (canReachPUC && resUc && resUc >= 9950000) ? "puc-active" : "val-low-score";
        html += `<tr><td class="level-cell">${lv % 1 === 0 ? lv.toFixed(0) : lv.toFixed(1)}</td>`;
        html += `<td class="${getScoreClass(resEff, 'eff')}">${formatScore(resEff)}</td>`;
        html += `<td class="${getScoreClass(resExc, 'exc')}">${formatScore(resExc)}</td>`;
        html += `<td class="${getScoreClass(resMax, 'max')}">${formatScore(resMax)}</td>`;
        html += `<td class="${getScoreClass(resUc, 'uc')}">${formatScore(resUc)}</td>`;
        html += `<td class="${pucCls}">${txtPuc}</td></tr>`;
    });
    document.getElementById('tableBody').innerHTML = html;
}
function updateByDropdown() {
    currentStandardVF = VF_MAP[document.getElementById('classSel').value][document.getElementById('stepSel').value];
    changeFormat();
}
function updateByInput() {
    const input = document.getElementById('customVF');
    const fmt = getFormat();
    let val = parseFloat(input.value);
    if (isNaN(val)) return;
    currentStandardVF = (fmt === "int") ? val / 20 : (fmt === "p1") ? val / 2 : val;
    render();
}
updateByDropdown();
</script>
</body>
</html>
