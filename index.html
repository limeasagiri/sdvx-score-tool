<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volforce Calc. - Tactical Hub</title>
    <style>
        :root {
            --bg-deep: #0a0e0a;
            --army-green: #2d3b2d;
            --neon-lime: #b0ff2e;
            --text-main: #e0eee0;
            --line-sub: rgba(176, 255, 46, 0.2);
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            /* 背景にグリッド（方眼）を敷く */
            background-image: 
                linear-gradient(var(--line-sub) 1px, transparent 1px),
                linear-gradient(90deg, var(--line-sub) 1px, transparent 1px);
            background-size: 40px 40px;
            overflow-x: hidden;
        }

        /* 背景にうっすら地図のような円形グラデーション */
        body::before {
            content: "";
            position: fixed;
            top: 50%; left: 50%;
            width: 200%; height: 200%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(45, 59, 45, 0.3) 0%, transparent 70%);
            z-index: -1;
        }

        header {
            padding: 50px 0;
            text-align: center;
            border-bottom: 2px solid var(--neon-lime);
            background: rgba(0, 0, 0, 0.8);
            position: relative;
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--neon-lime);
            text-shadow: 0 0 15px var(--neon-lime);
        }

        /* 楽曲決定画面風の三角デコレーション */
        header::after {
            content: "▼ NEXT PHASE";
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--neon-lime);
            color: black;
            padding: 2px 15px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            padding: 0 20px;
        }

        .tool-card {
            background: rgba(45, 59, 45, 0.4);
            border: 1px solid var(--army-green);
            padding: 30px;
            text-decoration: none;
            color: inherit;
            position: relative;
            transition: 0.3s;
            clip-path: polygon(0 0, 95% 0, 100% 15%, 100% 100%, 5% 100%, 0 85%); /* 角を少し削る */
        }

        .tool-card:hover {
            background: rgba(176, 255, 46, 0.1);
            border-color: var(--neon-lime);
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(176, 255, 46, 0.2);
        }

        .tool-card h3 {
            margin: 0 0 10px 0;
            color: var(--neon-lime);
            border-left: 4px solid var(--neon-lime);
            padding-left: 10px;
        }

        .tool-card p {
            font-size: 0.85rem;
            opacity: 0.8;
            margin: 0;
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<header>
    <h1>SYSTEM: VOL-CALC ∇</h1>
</header>

<div class="container">
    <a href="vol-to-score.html" class="tool-card">
        <h3>TARGET SCORE</h3>
        <p>目標VFから必要なスコアを算出します。</p>
    </a>
    <a href="score-hayami.html" class="tool-card">
        <h3>SCORE TABLE</h3>
        <p>目標VFとメダルの相関図を表示します。</p>
    </a>
    <a href="solo-vol.html" class="tool-card">
        <h3>CALCULATE VF</h3>
        <p>リザルト値を元に単曲VFを算出します。</p>
    </a>
    <a href="vol-hayami.html" class="tool-card">
        <h3>VF QUICK REF</h3>
        <p>メダル基準のVF到達度を可視化します。</p>
    </a>
</div>

<footer>
    <div style="margin-bottom: 10px;">
        <a href="rule.html" style="color: inherit; margin: 0 10px;">TERMS</a>
        <a href="contact.html" style="color: inherit; margin: 0 10px;">CONTACT</a>
    </div>
    <p>OPERATING UNDER PROTOCOL: SDVX-VII-TACTICAL</p>
</footer>

</body>
</html>
