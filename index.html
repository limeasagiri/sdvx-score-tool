<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volforce Calc. - SDVX スコアツール</title>
    <style>
        :root {
            --bg-color: #0d0d12;
            --card-bg: #1a1a24;
            --accent-pink: #ff0055;
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --text-sub: #b0b0c0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 40px 0;
            text-align: center;
            background: linear-gradient(180deg, #1a1a2e 0%, var(--bg-color) 100%);
            border-bottom: 2px solid var(--accent-pink);
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-pink);
        }

        .container {
            max-width: 800px;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .container { grid-template-columns: 1fr; }
        }

        .tool-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        .tool-card h3 {
            margin: 0 0 10px 0;
            color: var(--accent-cyan);
            font-size: 1.25rem;
        }

        .tool-card p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.5;
        }

        footer {
            margin-top: auto;
            padding: 40px 0;
            text-align: center;
            font-size: 0.8rem;
            color: #555;
        }

        .footer-links {
            margin-bottom: 20px;
        }

        .footer-links a {
            color: var(--text-sub);
            text-decoration: none;
            margin: 0 15px;
        }

        .footer-links a:hover { color: var(--accent-pink); }
    </style>
</head>
<body>

<header>
    <h1>Volforce Calc.</h1>
</header>

<div class="container">
    <a href="vol-to-score.html" class="tool-card">
        <h3>目標スコア算出</h3>
        <p>VOLFORCEから各クリアランクの目標スコアを算出します。</p>
    </a>

    <a href="score-hayami.html" class="tool-card">
        <h3>目標スコア早見表</h3>
        <p>目標VFとメダルを参照し、一定前後の目標スコアを一覧表示します。</p>
    </a>

    <a href="solo-vol.html" class="tool-card">
        <h3>単曲VOLFORCE算出</h3>
        <p>楽曲スコアや判定詳細からVFを算出し、上げるための目安を表示します。</p>
    </a>

    <a href="vol-hayami.html" class="tool-card">
        <h3>VOLFORCE早見表</h3>
        <p>メダルを基準に単曲VFを算出し、目標をマスの塗りつぶしで表示します。</p>
    </a>
</div>

<footer>
    <div class="footer-links">
        <a href="rule.html">利用規約</a>
        <a href="contact.html">お問い合わせ</a>
    </div>
    <p>© 2026 VOLFORCE Calc. Developer</p>
</footer>

</body>
</html>
